<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVE · Provider information design review</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;color:#102e43;background:#f4f6f8;--slate:#334f60;--teal:#066d73;--line:#dce3e9}
*{box-sizing:border-box}body{margin:0}h1,h2,p,dl,dd{margin:0}header{background:#102e43;color:#fff;padding:20px 24px}.header-inner{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-size:1.25rem}.banner{display:block;font-size:.9rem;margin-top:4px}label{display:flex;align-items:center;gap:12px}select{font:inherit;min-height:44px;padding:8px;color:#102e43;background:#fff;border:1px solid #8191a0;border-radius:5px}main{max-width:1000px;margin:auto;padding:28px 24px 60px}h1{font-size:1.65rem;line-height:1.3}.intro{color:var(--slate);max-width:70ch;margin:12px 0 24px}.card{background:#fff;border:1px solid #cbd6de;border-radius:8px;padding:24px}.context{font-size:.875rem;color:var(--slate);padding-bottom:16px;border-bottom:1px solid var(--line)}summary{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;cursor:pointer;list-style:none;font-size:1.125rem;font-weight:750}summary::-webkit-details-marker{display:none}summary::after{content:"+";font-size:1.4rem;font-weight:600}details[open]>summary::after{content:"−"}.content{border-top:1px solid var(--line);padding-top:16px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px}.facts>div{min-width:0}dt{font-size:.875rem;color:var(--slate)}dd{font-size:1rem;font-weight:500;margin-top:2px;overflow-wrap:anywhere}.links{display:flex;align-items:center;gap:4px 24px;flex-wrap:wrap;margin-top:12px}a{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--teal);font-size:.9375rem;font-weight:600;text-underline-offset:3px}a svg{width:16px;height:16px;flex-shrink:0}.source-note{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;font-size:.875rem;color:var(--slate);max-width:78ch}.notes{color:var(--slate);max-width:76ch;margin-top:28px;font-size:.9375rem}.notes h2{font-size:1.05rem;color:#102e43}.notes ul{padding-left:20px}.notes li+li{margin-top:8px}:focus-visible{outline:3px solid #245bd1;outline-offset:4px}p,li{overflow-wrap:anywhere}
@media(max-width:600px){header{padding:16px}main{padding:24px 16px 40px}.card{padding:16px}h1{font-size:1.4rem}.facts{gap:14px 16px}.links{gap:0 16px}}
@media(max-width:380px){.facts{grid-template-columns:minmax(0,1fr)}}
.provider-header{display:flex;align-items:center;gap:16px;min-height:56px}.provider-heading{margin:0;font-size:1.125rem;flex:0 0 auto}.disclosure{display:flex;align-items:center;gap:12px;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;font-weight:750;cursor:pointer;text-align:left}.disclosure::before{content:"−";font-size:1.4rem;font-weight:600}.disclosure[aria-expanded="false"]::before{content:"+"}.leader{flex:1;min-width:24px;border-bottom:2px dotted #aebec8}.provider-header .links{justify-content:flex-end;margin:0;gap:4px 16px}.provider-header .links a{font-size:.875rem}.content[hidden]{display:none}.source-note{margin-top:16px}
@media(max-width:760px){.provider-header{flex-wrap:wrap;gap:0 12px;padding:6px 0}.provider-header .links{flex-basis:100%;margin-left:auto;justify-content:flex-end}.leader{align-self:center}}
/* Match the shipped home layout and supplier-card shell, without importing app code. */
main{max-width:1160px;padding:28px 30px 60px}.preview-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:28px;align-items:start}.card{min-width:0;padding:24px;border-radius:16px;box-shadow:0 2px 8px #102e4306;container-type:inline-size}.notes{max-width:715px}.provider-header .links{min-width:0}.provider-header .links a{overflow-wrap:anywhere}
@media(max-width:900px){.preview-layout{grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:20px}}
@media(max-width:760px){main{padding:26px 18px 40px}.preview-layout{grid-template-columns:minmax(0,1fr);gap:20px}.card{padding:20px}}
@container(max-width:620px){.provider-header{flex-wrap:wrap;gap:0 12px;padding:6px 0}.provider-header .links{flex-basis:100%;justify-content:flex-end}.leader{align-self:center}}
</style>
</head>
<body>
<header><div class="header-inner"><div><strong class="brand">WAVE</strong><span class="banner" id="banner"></span></div><label><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="es">Español</option></select></label></div></header>
<main><h1 id="title"></h1><p class="intro" id="intro"></p>
<div class="preview-layout"><section class="card" aria-label="Provider information wireframe"><p class="context" id="context"></p>
<details open><summary id="summary"></summary><div class="content"><dl class="facts" id="facts"></dl>
<div class="links"><a href="https://health.arkansas.gov/Eng/WS.aspx?ID=747" target="_blank" rel="noopener noreferrer"><span id="profileLink"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a><a href="https://health.arkansas.gov/eng/CCRSearch.aspx" target="_blank" rel="noopener noreferrer"><span id="reportsLink"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a></div>
<p class="source-note" id="sourceNote"></p></div></details></section></div>
<aside class="notes"><h2 id="notesTitle"></h2><ul id="notes"></ul></aside></main>
<script>
// Standalone design only. Existing saved directory facts; no live checks or app changes.
const copy={
en:{banner:'Design wireframe · Provider information only · Not the live app',title:'Provider information — compact review',intro:'Shorter labels, separate source and system type, and one source-and-limits footer. Try the + / − control or switch to Spanish.',context:'Leisure Hills Mobile Home Park · Existing saved ADH directory facts',summary:'Provider information',facts:[['System ID','747'],['Water source','Groundwater'],['System type','Community system'],['Source name','WELL #1'],['Retail population','113'],['Last listed inspection','Feb 5, 2026']],profileLink:'ADH profile',reportsLink:'Annual water-quality reports',sourceNote:'ADH directory · Checked Oct 14, 2026. Not live readings, inspection results, current compliance findings, or a safety rating. For annual reports, confirm the system and year.',notesTitle:'What to review',notes:['One compact facts grid, with the same navy headings and slate labels as Advisory history.','Source wording “WELL #1” is preserved. The inspection date is a directory entry—not a statement about inspection results.','Links open the official supplier profile and annual-report search in new tabs. No contact details or advisory history are repeated.']},
es:{banner:'Wireframe de diseño · Solo información del proveedor · No es la app en vivo',title:'Información del proveedor — revisión compacta',intro:'Etiquetas más cortas, fuente y tipo de sistema separados, y una sola nota de fuente y límites. Prueba el control + / − o cambia de idioma.',context:'Leisure Hills Mobile Home Park · Datos guardados del directorio de ADH',summary:'Información del proveedor',facts:[['ID del sistema','747'],['Fuente de agua','Agua subterránea'],['Tipo de sistema','Sistema comunitario'],['Nombre de la fuente','WELL #1'],['Población minorista','113'],['Última inspección registrada','5 de febrero de 2026']],profileLink:'Perfil de ADH',reportsLink:'Informes anuales de calidad del agua',sourceNote:'Directorio de ADH · Revisado el 14 de octubre de 2026. No son mediciones en vivo, resultados de inspección, conclusiones actuales de cumplimiento ni una calificación de seguridad. Para los informes anuales, confirma el sistema y el año.',notesTitle:'Qué revisar',notes:['Una cuadrícula compacta con los mismos encabezados azul marino y etiquetas pizarra que el historial de avisos.','Se conserva el texto “WELL #1” de la fuente. La fecha de inspección es un dato del directorio, no una afirmación sobre los resultados.','Los enlaces abren el perfil oficial del proveedor y el buscador de informes anuales en pestañas nuevas. No se repiten datos de contacto ni avisos.']}}
function render(){const lang=document.getElementById('language').value,c=copy[lang];document.documentElement.lang=lang;for(const id of ['banner','title','intro','context','summary','profileLink','reportsLink','sourceNote','notesTitle'])document.getElementById(id).textContent=c[id];document.getElementById('languageLabel').textContent=lang==='en'?'Language':'Idioma';document.getElementById('facts').replaceChildren(...c.facts.map(([label,value])=>{const div=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;if(value==='WELL #1')dd.lang='en';div.append(dt,dd);return div}));document.getElementById('notes').replaceChildren(...c.notes.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));document.querySelectorAll('.links a').forEach(a=>a.setAttribute('aria-label',a.textContent+(lang==='en'?' (opens in a new tab)':' (se abre en otra pestaña)')))}
// Keep source links outside the disclosure button so opening a source never toggles the facts.
const details=document.querySelector('details'),content=document.querySelector('.content'),links=document.querySelector('.links');
const heading=document.createElement('div');heading.className='provider-header';
heading.innerHTML='<h2 class="provider-heading"><button class="disclosure" type="button" aria-expanded="true" aria-controls="providerFacts"><span id="summary"></span></button></h2><span class="leader" aria-hidden="true"></span>';
details.querySelector('summary').remove();heading.append(links);content.id='providerFacts';details.replaceWith(heading,content);
document.querySelector('.disclosure').addEventListener('click',event=>{const button=event.currentTarget,open=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!open));content.hidden=open});
document.getElementById('language').addEventListener('change',render);render();
</script>
</body>
</html>
