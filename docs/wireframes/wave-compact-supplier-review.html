<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVE · Compact supplier card review</title>
<style>
:root{font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102e43;background:#f4f6f8;--slate:#334f60;--teal:#317f84;--line:#dce3e9}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,summary,select{cursor:pointer}button:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #2b63cc;outline-offset:4px}header{background:#102e43;color:white;padding:16px 30px}.bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center}.bar small{display:block}select{min-height:44px;padding:6px;background:white;color:#102e43;border-radius:6px}main{max-width:1160px;margin:auto;padding:28px 30px 60px}h1{font-size:1.6rem;margin:0 0 8px}.intro{color:var(--slate);max-width:70ch;margin:0 0 24px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:28px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0}h2{font-size:1.4rem;line-height:1.3;margin:0 0 8px}p{margin:0}.location{color:var(--slate);font-size:.9375rem}.status{margin:20px 0 14px;padding:16px;background:#edf2f5;border:1px solid #e0e7ed;border-radius:8px;text-align:center}.status strong{font-size:1.125rem}.check{display:flex;gap:12px;align-items:baseline;color:var(--slate);font-size:.875rem;flex-wrap:wrap}.check time{margin-left:auto}.actions{display:flex;gap:12px;margin:16px 0}.actions button{min-height:44px;flex:1;border:1px solid var(--teal);border-radius:7px;background:white;color:#236e76;font-weight:650;padding:10px}.actions button:first-child{background:var(--teal);color:white}details{border-top:1px solid var(--line)}summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:48px;font-weight:650}summary::-webkit-details-marker{display:none}summary::after{content:"+";font-size:1.35rem;margin-left:auto}details[open]>summary::after{content:"−"}.expanded{padding:4px 0 16px}.explanation{color:var(--slate);font-size:.9375rem;margin:0 0 18px}.contact{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}.caption strong{display:block}.text-link{color:#236e76;text-decoration:underline;text-underline-offset:3px;font-size:.875rem}.contact-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}button.secondary{min-height:44px;border:1px solid #c9d4df;background:white;border-radius:7px;color:#102e43;padding:8px 10px;font-size:.875rem;overflow-wrap:anywhere;max-width:100%}.help{width:100%;margin-bottom:18px}.nested{padding:0 0 12px;color:var(--slate);font-size:.9375rem}.profile{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin:0 0 16px}.profile dt{font-size:.875rem;color:var(--slate)}.profile dd{margin:2px 0 0;color:#102e43;font-weight:500}.profile-links{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}.safety{font-size:.8125rem;color:var(--slate);margin-top:14px}.notes h2{font-size:1.1rem}.notes ul{padding-left:20px;color:var(--slate);font-size:.9375rem}.notes li+li{margin-top:12px}.notes .small{font-size:.8125rem;color:var(--slate)}[hidden]{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:20px}.contact-actions{margin-left:0}}
@media(max-width:760px){main{padding:24px 18px}.layout{grid-template-columns:1fr}.card{padding:20px}header{padding:16px 18px}.notes{margin-top:4px}}
@media(max-width:480px){.check time{margin-left:0}.actions{gap:8px}.actions button{font-size:.875rem}.contact-actions{width:100%;flex-direction:column}.contact-actions button{text-align:left}.profile{grid-template-columns:1fr}h2{font-size:1.25rem}}
</style>
</head>
<body>
<header><div class="bar"><div><strong>WAVE</strong><small id="banner"></small></div><select id="language" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select></div></header>
<main><h1 id="title"></h1><p class="intro" id="intro"></p><div class="layout"><article class="card"><h2>Leisure Hills Mobile Home Park</h2><p class="location" id="location"></p><div class="status" role="status"><strong id="status"></strong></div><p class="check"><strong id="check"></strong><time datetime="2026-10-19T11:15:00-05:00" id="time"></time></p><div class="actions"><button type="button" id="refresh"></button><button type="button" id="official"></button></div>
<details id="contactSection"><summary id="service"></summary><div class="expanded"><div class="contact"><span class="text-link" id="directory"></span><div class="contact-actions"><button class="secondary" type="button">☎ (479) 549-2158</button><button class="secondary" type="button">✉ LEISUREHILLSWATERCO@GMAIL.COM</button></div></div></div></details>
<details id="helpSection"><summary id="help"></summary><div class="nested" id="helpPreview"></div></details>
<details><summary id="historyLabel"></summary><div class="nested" id="history"></div></details>
<details><summary id="providerLabel"></summary><div class="nested"><div class="profile-links"><span class="text-link" id="profileLink"></span><span class="text-link" id="reportsLink"></span></div><dl class="profile" id="facts"></dl><p id="limits"></p></div></details>
<p class="safety" id="safety"></p></article><aside class="card notes"><h2 id="notesTitle"></h2><ul id="notes"></ul><p class="small" id="inert"></p><p class="small" id="explanation"></p></aside></div></main>
<script>
// Standalone wireframe: no app imports, network requests, storage, calls, or emails.
const copy={en:{banner:'Design review only · Not the live app',title:'A calmer supplier card',intro:'Start with the current status and the two main actions. Open “More details” for contact information, help, and records.',location:'Benton County · Arkansas Department of Health',status:'Current advisory status unavailable.',check:'Last successful check',time:'Oct 19, 2026, 11:15 AM CDT',refresh:'Check now',official:'Official source ↗',moreLabel:'More details',explanation:'The app cannot reach its backend. This is not a failed agency-feed check. Previously observed notices do not confirm the current status.',service:'Service questions?',directory:'ADH directory contact ↗',help:'Get help with a water issue',historyLabel:'Advisory history',history:'Your saved advisory records would appear here in the approved history layout. No historical notices are fabricated in this wireframe.',providerLabel:'Provider information',profileLink:'ADH profile ↗',reportsLink:'Annual water-quality reports ↗',limits:'ADH directory · Checked Oct 14, 2026. Not live readings, inspection results, current compliance findings, or a safety rating. Confirm the system and year for annual reports.',safety:'Published notices are not a safety test. No notice does not mean the water is safe.',notesTitle:'What changed',notes:['Only the supplier, status, last successful check, and main actions appear first.','One + button reveals the secondary content. History and provider facts stay individually expandable.','The unavailable status and a short safety caveat remain visible when collapsed.'],inert:'All action buttons and link-style labels are inactive. The date is an example copied from your screenshot—not a new live check.',facts:['System ID','747','Water source','Groundwater','System type','Community system','Source name','WELL #1','Retail population','113','Last listed inspection','Feb 5, 2026']},es:{banner:'Solo revisión de diseño · No es la aplicación',title:'Una tarjeta más sencilla',intro:'Primero, el estado actual y las dos acciones principales. Abre “Más detalles” para ver contactos, ayuda y registros.',location:'Condado de Benton · Departamento de Salud de Arkansas',status:'Estado actual de avisos no disponible.',check:'Última consulta exitosa',time:'19 oct 2026, 11:15 a. m. CDT',refresh:'Consultar ahora',official:'Fuente oficial ↗',moreLabel:'Más detalles',explanation:'La aplicación no puede conectarse a su servidor. Esto no es un fallo de consulta de la fuente oficial. Los avisos observados anteriormente no confirman el estado actual.',service:'¿Preguntas del servicio?',directory:'Contacto del directorio ADH ↗',help:'Obtener ayuda con un problema de agua',historyLabel:'Historial de avisos',history:'Aquí aparecerían los avisos guardados con el diseño aprobado. Esta maqueta no inventa avisos históricos.',providerLabel:'Información del proveedor',profileLink:'Perfil de ADH ↗',reportsLink:'Informes anuales de calidad del agua ↗',limits:'Directorio de ADH · Consultado el 14 oct 2026. No son lecturas en vivo, resultados de inspección, conclusiones actuales de cumplimiento ni una calificación de seguridad. Confirma el sistema y el año de los informes.',safety:'Los avisos publicados no son una prueba de seguridad. La ausencia de avisos no significa que el agua sea segura.',notesTitle:'Qué cambió',notes:['Al principio solo se muestran el proveedor, el estado, la última consulta exitosa y las acciones principales.','Un botón + muestra el contenido secundario. El historial y los datos del proveedor se expanden por separado.','El estado no disponible y una breve advertencia de seguridad siempre quedan visibles.'],inert:'Los botones y las etiquetas con estilo de enlace están inactivos. La fecha es un ejemplo de tu captura, no una nueva consulta en vivo.',facts:['ID del sistema','747','Origen del agua','Agua subterránea','Tipo de sistema','Sistema comunitario','Nombre de la fuente','WELL #1','Población minorista','113','Última inspección indicada','5 de febrero de 2026']}};
Object.assign(copy.en,{intro:'Keep each section title visible. Use its + button to open only the information you need.',helpPreview:'The existing water-issue help flow would open here. This wireframe does not send reports or contact anyone.',notes:['Each section keeps its own title and + button.','Contact information, help, history, and provider facts expand independently.','No extra “More details” section. The status and short safety caveat stay visible.']});
Object.assign(copy.es,{intro:'Cada sección conserva su título. Usa su botón + para abrir solo la información que necesitas.',helpPreview:'Aquí se abriría la ayuda existente para problemas de agua. Esta maqueta no envía reportes ni contacta a nadie.',notes:['Cada sección conserva su propio título y botón +.','Los contactos, la ayuda, el historial y los datos del proveedor se expanden por separado.','No hay una sección adicional de “Más detalles”. El estado y la advertencia breve siguen visibles.']});
function render(){const lang=document.getElementById('language').value,c=copy[lang];document.documentElement.lang=lang;for(const [key,value]of Object.entries(c)){const el=document.getElementById(key);if(el&&typeof value==='string')el.textContent=value}document.getElementById('notes').replaceChildren(...c.notes.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));document.getElementById('facts').replaceChildren(...Array.from({length:c.facts.length/2},(_,i)=>{const group=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=c.facts[i*2];dd.textContent=c.facts[i*2+1];if(i===3)dd.lang='en';group.append(dt,dd);return group}));}
document.getElementById('language').addEventListener('change',render);render();
</script>
</body></html>
