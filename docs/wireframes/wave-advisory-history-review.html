<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAVE · Advisory history design review</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102e43;background:#f4f6f8;line-height:1.5;font-size:16px;--slate:#334f60;--line:#dce3e9;--teal:#066d73}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #145fc0;outline-offset:4px}button{min-height:44px}h1,h2,h3,p,dl{margin:0}h1{font-size:1.65rem;line-height:1.3}h2{font-size:1.25rem;line-height:1.4}h3{font-size:1rem}p,dd,dt,button,summary{overflow-wrap:anywhere}header{background:#102e43;color:#fff;padding:20px 24px}header>div{max-width:1000px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}header strong{font-size:1.25rem}header span{display:block;font-size:.9rem;margin-top:4px}select{min-height:44px;padding:8px;background:#fff;color:#102e43;border:1px solid #8191a0;border-radius:5px}main{max-width:1000px;padding:28px 24px 60px;margin:auto}.intro{margin-bottom:24px;max-width:68ch}.intro p{margin-top:12px;color:var(--slate)}.layout{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:32px;align-items:start}.layout>*{min-width:0}.card{background:#fff;border:1px solid #cbd6de;border-radius:8px;padding:24px}.supplier{padding-bottom:20px;border-bottom:1px solid var(--line)}.supplier p{margin-top:8px;color:var(--slate)}.availability{margin-top:16px;padding:12px 16px;background:#eef3f6;color:var(--slate);border-left:3px solid #8191a0}.availability b{display:block;color:#102e43;margin-bottom:4px}.disclosure{margin-top:16px}summary{cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 0;min-height:48px;font-weight:650;list-style:none}summary::-webkit-details-marker{display:none}summary:before{content:'›';font-size:1.4rem;flex:0 0 14px}details[open]>summary:before{content:'⌄'}summary .count{margin-left:auto;color:var(--slate);font-size:.9rem;font-weight:400;flex-shrink:0}.history-content{padding:16px 20px 20px;background:#f9fbfc;border:1px solid var(--line);border-radius:5px;margin-top:8px}.quiet{color:var(--slate);font-size:.9375rem}.coverage{margin-bottom:20px}.notice{padding:20px 0;border-top:1px solid var(--line)}.notice:first-of-type{border-top:0;padding-top:0}.issued{color:var(--slate);margin-top:8px}.status{display:inline-block;margin-top:12px;font-weight:600;font-size:.9375rem;color:var(--slate)}.status.lifted{color:#075b60}.notice dl{margin-top:12px}.notice dt{color:var(--slate);font-size:.9375rem}.notice dd{margin:4px 0 0}.view{background:#fff;border:1px solid #9fb5c0;border-radius:5px;padding:10px 16px;color:var(--teal);font-weight:600;margin-top:16px}.more{width:100%;margin:0;padding:10px 16px;border:1px solid #9fb5c0;background:#fff;border-radius:5px;color:var(--teal);font-weight:600}.limits{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.surrounding{padding:16px 0 0;margin-top:16px;border-top:1px solid var(--line);color:var(--slate);font-size:.9375rem}.surrounding p+p{margin-top:12px}.annotations{color:var(--slate);font-size:.9375rem}.annotations h2{color:#102e43;font-size:1.05rem}.annotations p{margin-top:14px}.annotations ul{padding-left:20px;margin-top:16px}.annotations li+li{margin-top:12px}.back{padding:8px 0;border:0;background:none;color:var(--teal);text-decoration:underline;margin-bottom:16px}.detail h2{margin-top:8px}.detail .explanation{margin-top:12px;color:var(--slate)}.facts{margin:24px 0;display:grid;gap:16px}.facts dt{color:var(--slate);font-size:.9375rem}.facts dd{margin:4px 0 0}.source-block{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.source-block p{margin-top:12px}.source-block dl{margin-top:16px}.source-placeholder{margin-top:16px;padding:12px 16px;border:1px dashed #8191a0;color:var(--teal);font-weight:600}.prototype-label{color:var(--slate);font-size:.875rem;margin-bottom:12px}[hidden]{display:none!important}
@media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr);gap:28px}.annotations{border-top:1px solid var(--line);padding-top:24px}main{padding:24px 16px 40px}.card{padding:16px}.history-content{padding:16px}.view{width:100%;text-align:left}header{padding:16px}h1{font-size:1.4rem}}
/* Review refinement: keep the action beside the notice instead of in a spare row. */
summary::before{content:"+";font-size:1.25rem;text-align:center}
details[open]>summary::before{content:"−"}
.coverage{margin-bottom:16px}
.notice{display:block;padding:12px 0}
.notice-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
.notice-header h3{min-width:0}
.notice-header::after{content:"";flex:1 1 16px;min-width:12px;border-bottom:1px dotted #8191a0;order:1;align-self:center}
.notice-header .info-button{order:2}
.notice-header .view{flex-shrink:0}
.notice-copy{min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;align-items:start}
.notice .issued{margin:0;font-size:.9375rem}
.notice .status{margin:0;font-size:.9375rem}
.notice .issued{grid-column:1;grid-row:1}
.notice .lift-date{grid-column:2;grid-row:1}
.notice .area-fact{grid-column:1;grid-row:2}
.notice .reason-fact{grid-column:2;grid-row:2}
.notice .status{grid-column:2;grid-row:3;justify-self:end;max-width:100%;padding:9px 12px;border:1px solid #8191a0;border-left:4px solid #334f60;border-radius:5px;background:#eef3f6;color:#102e43;font-weight:750;line-height:1.4;margin-top:2px}
.notice .status.lifted{background:#e6f3f2;border-color:#8aafb0;border-left-color:#066d73;color:#075b60}
.date-line{display:flex;align-items:flex-start;gap:8px;color:var(--slate);font-size:.9375rem}
.date-line svg{flex:0 0 18px;width:18px;height:18px;margin-top:2px}
.notice-header h3{font-size:1.125rem;font-weight:750;line-height:1.35;letter-spacing:-.01em}
.notice-header::after{border-bottom-color:#a5b4be}
.notice .issued,.notice .lift-date{font-size:.875rem;line-height:1.5;color:var(--slate)}
.notice .date-line svg{width:16px;height:16px;flex-basis:16px}
.notice dl dt{font-size:.875rem;line-height:1.5;font-weight:400;color:var(--slate)}
.notice dl dd{font-size:1rem;line-height:1.5;font-weight:500;margin-top:2px}
.notice .status{border:0;border-left:3px solid #334f60;border-radius:0;background:#eef3f6;font-size:1.0625rem;font-weight:750;padding:8px 12px;line-height:1.4}
.notice .status::before{content:"Status: ";display:inline;font-size:inherit;line-height:inherit;font-weight:400;color:var(--slate)}
html:lang(es) .notice .status::before{content:"Estado: "}
.notice .status.lifted{border:0;border-left:3px solid #066d73;background:#e6f3f2}
.notice dl{display:block;margin:0;min-width:0}
.notice dd{margin:0;min-width:0}
.notice .view{width:auto;margin:0;text-align:center;justify-self:end}
.notice-header .view.info-button{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;min-width:44px;padding:8px;border:0;border-radius:50%;background:transparent;color:var(--teal)}
.info-button:hover{background:#e6f3f2}
.info-button:focus-visible{outline:3px solid #145fc0;outline-offset:4px}
@media(max-width:480px){.notice-header{gap:10px;align-items:flex-start}.notice-header h3{padding-top:10px}.notice-header .view{padding:10px;font-size:.9375rem;max-width:48%;flex-shrink:1}.notice-copy{grid-template-columns:minmax(0,1fr);gap:8px}.notice dd{margin-top:2px}}
@media(max-width:480px){.notice-copy>.issued,.notice-copy>.lift-date,.notice-copy>.area-fact,.notice-copy>.reason-fact,.notice-copy>.status{grid-column:auto;grid-row:auto}.notice-copy>.status{margin-top:4px;justify-self:end}}
.notice-copy>.status{grid-column:1 / -1;justify-self:stretch;width:100%;text-align:center;border-left:0;border-top:3px solid #334f60}
.notice-copy>.status.lifted{border-left:0;border-top:3px solid #066d73}
</style>
</head>
<body>
<header><div><div><strong>WAVE</strong><span id="banner"></span></div><label><span class="prototype-label" style="color:white" id="languageLabel">Language</span> <select id="language" aria-label="Language"><option value="en">English</option><option value="es">Español</option></select></label></div></header>
<main>
<div class="intro"><h1 id="title"></h1><p id="intro"></p></div>
<div class="layout"><section class="card" aria-label="Supplier history wireframe"><div id="listView"></div><div id="detailView" class="detail" hidden></div></section><aside class="annotations" id="notes"></aside></div>
</main>
<script>
// Synthetic design-only data. No API, storage, production imports, or real contact actions.
const copy={en:{banner:'Design wireframe · Fictional records · Not the live app',title:'Advisory history — review 1',intro:'Try the disclosure, “View details,” and “Show more.” Resize for mobile or switch to Spanish. This proposal does not change WAVE.',supplier:'Example Creek Water System',county:'Fictional supplier · Arkansas',unavailable:'Data unavailable',unavailableText:'The current ADH feed could not be retrieved. Saved notices below do not establish the current status.',history:'Advisory history',saved:'saved',coverage:'Saved history since January 2026; earlier advisories may be missing.',notice:'Boil-water notice',issued:'Issued by ADH',unknownDate:'Not provided by ADH',unconfirmed:'Current status unconfirmed',lifted:'Agency explicitly lifted',area:'Affected area',reason:'Reason',view:'View details',more:'Show more advisories',limits:'Saved notices are not a complete agency archive. A missing notice does not confirm a lift or safe water.',neighbor:'Other supplier-card controls remain unchanged; not designed in this review.',safety:'Follow official agency instructions. This history is not a water-safety determination.',back:'Back to advisory history',lift:'Agency lift date',unknownLift:'Unknown — no verified lift date saved',explain:'Disappearance from the notice list does not confirm a lift.',instructions:'Official instructions',noInstructions:'No verified official instructions are saved for this example notice.',source:'Source and record',original:'Original agency wording is retained in English.',published:'Published supplier name',countyLabel:'County',first:'First observed by WAVE',last:'Last observed by WAVE',observed:'WAVE observation times are retrieval evidence, not agency issue or lift dates.',link:'Open official ADH notice list ↗',disabledLink:'Link placement only — disabled in this wireframe.',notes:'What to review',note1:'Five distinct advisories appear first, newest-issued first. “Show more” reveals the sixth. These are notices, not repeated checks.',note2:'16px mobile padding, 20px expanded-content padding on desktop, 20px row separation, and 44px minimum action targets.',note3:'One focused detail view replaces the list. Back returns to the selected notice without losing your place.',note4:'Text wraps naturally. No nested accordions, clipped areas, or competing row actions.',note5:'An old notice is never automatically marked lifted. Current feed availability remains separate.',dates:'en-US'},es:{banner:'Wireframe de diseño · Registros ficticios · No es la app en vivo',title:'Historial de avisos — revisión 1',intro:'Prueba el desplegable, “Ver detalles” y “Mostrar más”. Cambia el tamaño para móvil o el idioma. Esta propuesta no modifica WAVE.',supplier:'Example Creek Water System',county:'Proveedor ficticio · Arkansas',unavailable:'Datos no disponibles',unavailableText:'No se pudo obtener la fuente actual de ADH. Los avisos guardados no confirman el estado actual.',history:'Historial de avisos',saved:'guardados',coverage:'Historial guardado desde enero de 2026; pueden faltar avisos anteriores.',notice:'Aviso de hervir el agua',issued:'Emitido por ADH',unknownDate:'No proporcionado por ADH',unconfirmed:'Estado actual sin confirmar',lifted:'La agencia lo levantó explícitamente',area:'Área afectada',reason:'Motivo',view:'Ver detalles',more:'Mostrar más avisos',limits:'Los avisos guardados no son un archivo completo de la agencia. La ausencia de un aviso no confirma su levantamiento ni la seguridad del agua.',neighbor:'Los demás controles del proveedor permanecen sin cambios; no se diseñan en esta revisión.',safety:'Sigue las instrucciones oficiales. Este historial no determina la seguridad del agua.',back:'Volver al historial de avisos',lift:'Fecha de levantamiento por la agencia',unknownLift:'Desconocida — no hay fecha de levantamiento verificada',explain:'La desaparición de la lista no confirma un levantamiento.',instructions:'Instrucciones oficiales',noInstructions:'No hay instrucciones oficiales verificadas guardadas para este aviso de ejemplo.',source:'Fuente y registro',original:'Se conserva el texto original de la agencia en inglés.',published:'Nombre publicado del proveedor',countyLabel:'Condado',first:'Primera observación de WAVE',last:'Última observación de WAVE',observed:'Las observaciones de WAVE son evidencia de consultas, no fechas de emisión ni de levantamiento de la agencia.',link:'Abrir la lista oficial de avisos de ADH ↗',disabledLink:'Solo muestra la ubicación del enlace; está desactivado en este wireframe.',notes:'Qué revisar',note1:'Se muestran cinco avisos distintos, del más reciente al más antiguo. “Mostrar más” revela el sexto. Son avisos, no consultas repetidas.',note2:'16px de relleno en móvil, 20px en el contenido expandido en escritorio, 20px entre filas y controles de al menos 44px.',note3:'Una vista de detalles sustituye la lista. Al volver, se conserva la posición del aviso seleccionado.',note4:'El texto se ajusta sin recortes. No hay desplegables anidados ni acciones que compitan en cada fila.',note5:'Un aviso antiguo nunca se marca como levantado automáticamente. La disponibilidad de la fuente actual es independiente.',dates:'es-US'}};
const records=[
{date:'2026-10-12',area:'Customers along North Creek Road, including the north service loop.',reason:'Water main break',lift:null},
{date:'2026-08-20',area:'Entire system',reason:'Loss of pressure',lift:'2026-08-22'},
{date:'2026-06-11',area:'South service area',reason:'Water main repair',lift:null},
{date:'2026-04-03',area:'Entire system',reason:'Loss of pressure',lift:'2026-04-05'},
{date:'2026-02-18',area:'East service loop',reason:'Water main break',lift:'2026-02-20'},
{date:null,area:'West service area',reason:'Loss of pressure',lift:null}];
let lang='en',limit=5,selected=null,expanded=true;const $=id=>document.getElementById(id);const t=()=>copy[lang];const date=d=>d?new Date(d+'T12:00:00').toLocaleDateString(t().dates,{year:'numeric',month:'short',day:'numeric'}):t().unknownDate;
function status(r){return `<span class="status ${r.lift?'lifted':''}">${r.lift?t().lifted:lang==='es'?'Sin confirmar':'Unconfirmed'}</span>`}
function calendar(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18M7 15h3m4 0h3M7 18h3"/></svg>`}
function row(r,i){return `<article class="notice"><div class="notice-header"><h3>${t().notice}</h3><a class="view info-button" data-record="${i}" href="https://health.arkansas.gov/wa_engTraining/boilwaterorder.aspx" target="_blank" rel="noopener noreferrer" title="${t().officialLinkLabel}" aria-label="${t().officialLinkLabel}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 6v2"/></svg></a></div><div class="notice-copy"><p class="issued date-line">${calendar()}<span>${t().issued}: ${date(r.date)}</span></p>${r.lift?`<p class="lift-date date-line">${calendar()}<span>${t().lift}: ${date(r.lift)}</span></p>`:''}<dl class="area-fact"><dt>${t().area}:</dt><dd lang="en">${r.area}</dd></dl><dl class="reason-fact"><dt>${t().reason}:</dt><dd lang="en">${r.reason}</dd></dl>${status(r)}</div></article>`}
function render(){const c=t();document.documentElement.lang=lang;$('banner').textContent=c.banner;$('title').textContent=c.title;$('intro').textContent=c.intro;$('languageLabel').textContent=lang==='es'?'Idioma':'Language';$('notes').innerHTML=`<h2>${c.notes}</h2><ul>${[c.note1,c.note2,c.note3,c.note4,c.note5].map(n=>`<li>${n}</li>`).join('')}</ul>`;
$('listView').hidden=selected!==null;$('detailView').hidden=selected===null;
$('listView').innerHTML=`<div class="supplier"><h2>${c.supplier}</h2><p>${c.county}</p></div><div class="availability"><b>${c.unavailable}</b>${c.unavailableText}</div><details class="disclosure" ${expanded?'open':''}><summary><span>${c.history}</span><span class="count">6 ${c.saved}</span></summary><div class="history-content"><p class="quiet coverage">${c.coverage}</p>${records.slice(0,limit).map(row).join('')}${limit<records.length?`<button class="more" id="more">${c.more}</button>`:''}<p class="quiet limits">${c.limits}</p></div></details><div class="surrounding"><p>${c.neighbor}</p><p>${c.safety}</p></div>`;
$('listView').querySelector('details').addEventListener('toggle',e=>{expanded=e.target.open});
if($('more'))$('more').onclick=()=>{limit=records.length;render();$('listView').querySelector('[data-record="5"]').focus()};
if(selected!==null){const r=records[selected];$('detailView').innerHTML=`<button class="back" id="back">‹ ${c.back}</button><p class="prototype-label">${c.supplier}</p><h2 id="detailHeading" tabindex="-1">${c.notice}</h2>${status(r)}${!r.lift?`<p class="explanation">${c.explain}</p>`:''}<dl class="facts"><div><dt>${c.issued}</dt><dd>${date(r.date)}</dd></div><div><dt>${c.area}</dt><dd lang="en">${r.area}</dd></div><div><dt>${c.reason}</dt><dd lang="en">${r.reason}</dd></div><div><dt>${c.lift}</dt><dd>${r.lift?date(r.lift):c.unknownLift}</dd></div></dl><h3>${c.instructions}</h3><p class="explanation">${c.noInstructions}</p><div class="source-placeholder">${c.link}</div><p class="quiet explanation">${c.disabledLink}</p><section class="source-block"><h3>${c.source}</h3><p class="quiet">${c.original}</p><dl class="facts"><div><dt>${c.published}</dt><dd lang="en">Example Creek Water System</dd></div><div><dt>${c.countyLabel}</dt><dd lang="en">Example County (fictional)</dd></div><div><dt>${c.first}</dt><dd>${lang==='es'?'[Hora de consulta guardada]':'[Saved retrieval timestamp]'}</dd></div><div><dt>${c.last}</dt><dd>${lang==='es'?'[Hora de consulta guardada]':'[Saved retrieval timestamp]'}</dd></div></dl><p class="quiet">${c.observed}</p><p class="quiet">${c.safety}</p></section>`;$('back').onclick=()=>{const prior=selected;selected=null;render();$('listView').querySelector(`[data-record="${prior}"]`).focus()}}
}
copy.en.note2='A full-width status banner closes each advisory, with centered text and a restrained tint—not color alone. Calendar icons identify the issue and explicit lift dates. Area and reason stay side by side; facts stack on narrow phones.';
copy.es.note2='Una franja de estado de ancho completo cierra cada aviso con texto centrado y un fondo discreto, no solo con color. Los calendarios identifican las fechas de emisión y levantamiento explícito. Área y motivo siguen en paralelo; los datos se apilan en móviles estrechos.';
copy.en.intro='Try the + / − disclosure and “Show more.” Info icons open the real ADH notice list in a new tab—not a specific fictional advisory. This proposal does not change WAVE.';
copy.es.intro='Prueba el desplegable + / − y “Mostrar más”. Los iconos de información abren la lista real de ADH en otra pestaña, no un aviso ficticio específico. Esta propuesta no modifica WAVE.';
copy.en.officialLinkLabel='Open ADH notice list (opens in a new tab)';
copy.es.officialLinkLabel='Abrir la lista de avisos de ADH (se abre en otra pestaña)';
copy.en.note3='Info links go directly to the official source, not a WAVE detail view. A verified advisory-specific URL takes priority; otherwise the fallback is labelled “Open ADH notice list.” Fictional examples use only the list link.';
copy.es.note3='Los enlaces de información abren la fuente oficial, no una vista de WAVE. Se prioriza un enlace verificado al aviso específico; si no existe, se indica “Abrir la lista de avisos de ADH”. Los ejemplos ficticios solo enlazan a la lista.';
$('language').onchange=e=>{lang=e.target.value;render()};render();
</script>
</body>
</html>
