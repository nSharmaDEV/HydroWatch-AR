<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAVE · Contact source design review</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;color:#102e43;background:#f4f6f8;--slate:#334f60;--teal:#066d73;--line:#dce3e9}
*{box-sizing:border-box}body{margin:0}h1,h2,p{margin:0}header{background:#102e43;color:white;padding:20px 24px}.header-inner{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.brand{font-size:1.25rem}.banner{display:block;font-size:.9rem;margin-top:4px}label{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select{font:inherit;min-height:44px;padding:8px;background:white;color:#102e43;border:1px solid #8191a0;border-radius:5px}main{max-width:1000px;margin:auto;padding:28px 24px 60px}h1{font-size:1.65rem;line-height:1.3}.intro{color:var(--slate);max-width:68ch;margin:12px 0 24px}.layout{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:32px;align-items:start}.layout>*{min-width:0}.card{padding:24px;background:white;border:1px solid #cbd6de;border-radius:8px}.context{font-size:.875rem;color:var(--slate);padding-bottom:16px;border-bottom:1px solid var(--line)}details{margin-top:12px}summary{display:flex;gap:12px;align-items:center;min-height:48px;padding:12px 0;font-weight:650;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:"+";flex:0 0 16px;text-align:center;font-size:1.25rem}details[open]>summary::before{content:"−"}.content{padding:12px 0 4px 28px}.description{color:var(--slate);font-size:.9375rem}.date{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:650}.date svg{width:18px;height:18px;flex-shrink:0;color:var(--slate)}a{display:inline-flex;gap:6px;align-items:center;min-height:44px;margin-top:12px;color:var(--teal);font-weight:600;text-underline-offset:3px}.qualification{font-size:.9375rem;color:var(--slate);margin-top:12px}.footer-context{border-top:1px solid var(--line);margin-top:20px;padding-top:16px;font-size:.875rem;color:var(--slate)}.notes{font-size:.9375rem;color:var(--slate)}.notes h2{font-size:1.05rem;color:#102e43}.notes ul{padding-left:20px;margin:16px 0 0}.notes li+li{margin-top:12px}p,summary,a{overflow-wrap:anywhere}:focus-visible{outline:3px solid #145fc0;outline-offset:4px}a svg{width:16px;height:16px;flex-shrink:0}
@media(max-width:760px){header{padding:16px}main{padding:24px 16px 40px}h1{font-size:1.4rem}.layout{grid-template-columns:minmax(0,1fr);gap:28px}.card{padding:16px}.notes{border-top:1px solid var(--line);padding-top:24px}.content{padding-left:28px}}
@media(max-width:360px){.content{padding-left:0}}
.source-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 6px;margin-top:16px;font-size:.9375rem;color:var(--slate)}
.source-line a{margin:0;font-size:inherit;min-height:44px}
.source-note{font-size:.875rem;color:var(--slate);line-height:1.6;margin-top:4px}
.layout{grid-template-columns:minmax(0,1fr);gap:28px}
.contact-row{display:flex;align-items:center;gap:20px;margin-top:20px}
.contact-caption{flex:0 0 auto;min-width:0}
.contact-caption h2{font-size:1.125rem;line-height:1.4;padding-top:0}
.contact-caption a{display:flex;align-items:flex-start;min-height:24px;font-size:.875rem;font-weight:400;line-height:1.4;margin-top:0;padding-top:0}
.contact-actions{display:flex;flex:1;justify-content:flex-end;gap:10px;min-width:0}
.contact-actions button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 12px;font:inherit;font-size:.9375rem;font-weight:600;color:#102e43;background:#fff;border:1px solid #c9d4df;border-radius:7px;min-width:0;cursor:default}
.contact-actions button:first-child{flex:0 0 auto}
.contact-actions button:last-child{flex:0 1 auto}
.contact-actions svg{width:20px;height:20px;flex:0 0 20px}
.contact-actions span{overflow-wrap:anywhere;min-width:0}
.notes{max-width:76ch}
@media(max-width:900px){.contact-row{flex-direction:column;align-items:flex-start;gap:12px}.contact-actions{width:100%;flex-wrap:wrap}.contact-actions button:last-child{flex:0 1 auto}}
@media(max-width:480px){.contact-actions{flex-direction:column}.contact-actions button,.contact-actions button:last-child{flex:0 1 auto;width:100%;justify-content:flex-start}.contact-actions button{font-size:.875rem}}
</style>
</head>
<body>
<header><div class="header-inner"><div><strong class="brand">WAVE</strong><span id="banner" class="banner"></span></div><label><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="es">Español</option></select></label></div></header>
<main><h1 id="title"></h1><p id="intro" class="intro"></p><div class="layout"><section class="card" aria-label="Contact source wireframe"><p class="context" id="context"></p><details open><summary id="summary"></summary><div class="content"><p class="description" id="description"></p><p class="date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18M7 15h3m4 0h3M7 18h3"/></svg><time datetime="2026-10-14" id="date"></time></p><a href="https://health.arkansas.gov/Eng/WS.aspx?ID=747" target="_blank" rel="noopener noreferrer" id="source"><span id="sourceText"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a><p class="qualification" id="qualification"></p></div></details><p class="footer-context" id="footerContext"></p></section><aside class="notes"><h2 id="notesTitle"></h2><ul id="notes"></ul></aside></div></main>
<script>
// Standalone design artifact. No app imports, API requests, calls, emails, or storage.
const copy={
 en:{banner:'Design wireframe · Contact source only · Not the live app',title:'Contact source — review 1',intro:'A quiet disclosure for contact provenance. Try the + / − control or switch to Spanish. No supplier facts or contact actions are repeated here.',context:'Placement: immediately below the existing phone/email controls. Those controls are not reproduced in this wireframe.',summary:'Contact source: ADH directory',description:'Phone/email checked against the directory:',date:'Oct 14, 2026',sourceText:'View directory source',qualification:'Hours and response times are unverified.',footerContext:'Advisory history and Provider information remain separate and are not shown here.',notesTitle:'What to review',notes:['Only three pieces of information: when the phone/email fields were checked, where they came from, and what remains unverified.','The checked date is the saved directory review date—not a new live check or proof that someone answered a call.','The link opens the official ADH profile for Leisure Hills Mobile Home Park (system 747) in a new tab. It is a directory source, not an advisory or water-safety status.','No repeated system name, phone/email, provider facts, or safety banner. Provider information is not redesigned in this artifact.']},
 es:{banner:'Wireframe de diseño · Solo fuente del contacto · No es la app en vivo',title:'Fuente del contacto — revisión 1',intro:'Un desplegable discreto sobre el origen del contacto. Prueba el control + / − o cambia de idioma. Aquí no se repiten datos del proveedor ni acciones de contacto.',context:'Ubicación: justo debajo de los controles de teléfono y correo existentes. Esos controles no se reproducen en este wireframe.',summary:'Fuente del contacto: directorio de ADH',description:'Teléfono y correo contrastados con el directorio:',date:'14 de octubre de 2026',sourceText:'Ver fuente del directorio',qualification:'No se han verificado los horarios ni los tiempos de respuesta.',footerContext:'El historial de avisos y la información del proveedor permanecen separados y no se muestran aquí.',notesTitle:'Qué revisar',notes:['Solo tres datos: cuándo se comprobaron el teléfono y el correo, de dónde proceden y qué sigue sin verificar.','La fecha corresponde a la revisión guardada del directorio; no es una consulta nueva en vivo ni confirma que alguien contestó una llamada.','El enlace abre el perfil oficial de ADH de Leisure Hills Mobile Home Park (sistema 747) en otra pestaña. Es una fuente de directorio, no un aviso ni un estado de seguridad del agua.','No se repiten el nombre del sistema, teléfono, correo, datos del proveedor ni advertencias de seguridad. La información del proveedor no se rediseña en este archivo.']}
};
// Revised proposal: provenance is a direct secondary link, not a disclosure.
const sourceSection=document.querySelector('details');
sourceSection.replaceWith(Object.assign(document.createElement('div'),{id:'directSource'}));
const cEn=copy.en,cEs=copy.es;
cEn.intro='Contact provenance becomes one direct directory link beneath the existing phone/email controls. No extra disclosure or tab.';
cEs.intro='El origen del contacto se muestra como un enlace directo al directorio debajo del teléfono y correo existentes. Sin desplegable ni pestaña adicional.';
cEn.notes=['One quiet source link; no + / − disclosure or extra step.','The checked date is the saved review of the directory contact fields—not a new live check or a response-time guarantee.','The link opens the specific supplier’s official ADH directory profile in a new tab. It does not represent advisory status.'];
cEs.notes=['Un enlace discreto a la fuente, sin desplegable + / − ni paso adicional.','La fecha corresponde a la revisión guardada de los datos del contacto en el directorio, no a una consulta nueva ni a una garantía de respuesta.','El enlace abre el perfil oficial del proveedor en el directorio de ADH en otra pestaña. No representa el estado de un aviso.'];
function renderDirect(){const lang=document.getElementById('language').value,c=copy[lang];document.getElementById('directSource').innerHTML=`<div class="contact-row"><div class="contact-caption"><h2>${lang==='en'?'Service questions?':'¿Preguntas del servicio?'}</h2><a id="source" href="https://health.arkansas.gov/Eng/WS.aspx?ID=747" target="_blank" rel="noopener noreferrer" aria-label="${lang==='en'?'ADH directory contact (opens in a new tab)':'Contacto del directorio ADH (se abre en otra pestaña)'}">${lang==='en'?'ADH directory contact':'Contacto del directorio ADH'} <span aria-hidden="true">↗</span></a></div><div class="contact-actions"><button type="button" title="${lang==='en'?'Design preview only — no call is placed':'Solo diseño — no se realiza ninguna llamada'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 3h4l2 5-2 2a16 16 0 0 0 6 6l2-2 5 2v4c-9 3-20-8-17-17Z"/></svg><span>${lang==='en'?'Call':'Llamar'} (479) 549-2158</span></button><button type="button" title="${lang==='en'?'Design preview only — no email is sent':'Solo diseño — no se envía ningún correo'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg><span>LEISUREHILLSWATERCO@GMAIL.COM</span></button></div></div>`;document.documentElement.lang=lang;for(const id of ['banner','title','intro','context','footerContext','notesTitle'])document.getElementById(id).textContent=c[id];document.getElementById('languageLabel').textContent=lang==='en'?'Language':'Idioma';document.getElementById('notes').replaceChildren(...c.notes.map(text=>{const li=document.createElement('li');li.textContent=text;return li}))}
document.getElementById('language').addEventListener('change',renderDirect);
copy.en.title='Service questions — contact row review';
copy.es.title='Preguntas del servicio — revisión de contactos';
copy.en.intro='The separate Contact source section is removed. “ADH directory contact” is the source link. Call and email sit beside the question on wide screens. Contact buttons are inert design previews.';
copy.es.intro='Se elimina la sección separada de fuente del contacto. “Contacto del directorio ADH” enlaza a la fuente. Los botones de llamada y correo aparecen junto a la pregunta en pantallas amplias. Son solo ejemplos de diseño sin acciones.';
copy.en.context='Supplier contact row — shown with the existing Leisure Hills directory contact fields.';
copy.es.context='Fila de contacto del proveedor, con los datos existentes del directorio de Leisure Hills.';
copy.en.notes=['One contact row: question and source on the left; call and email aligned with the question on the right.','The directory caption links directly to the official supplier profile. There is no separate source disclosure or repeated link.','On narrow screens, actions wrap underneath instead of colliding. No real calls or emails are triggered in this wireframe.'];
copy.es.notes=['Una fila: pregunta y fuente a la izquierda; llamada y correo alineados con la pregunta a la derecha.','El enlace del directorio abre el perfil oficial del proveedor. No hay un desplegable separado ni un enlace repetido.','En pantallas estrechas, los botones pasan debajo sin solaparse. Este wireframe no realiza llamadas ni envía correos.'];
renderDirect();
</script>
</body>
</html>
